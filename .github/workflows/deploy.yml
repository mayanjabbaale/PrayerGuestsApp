name: Deploy to PythonAnywhere

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      PA_HOST: ${{ secrets.PA_HOST }}
      PA_USERNAME: ${{ secrets.PA_USERNAME }}
      PA_PROJECT_DIR: ${{ secrets.PA_PROJECT_DIR || '/home/tardigrade/PrayerGuestsApp' }}
      PA_VENV_PATH: ${{ secrets.PA_VENV_PATH || '/home/tardigrade/.virtualenvs/myenv' }}
      PA_WSGI_PATH: ${{ secrets.PA_WSGI_PATH || '/var/www/tardigrade_pythonanywhere_com_wsgi.py' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH access
        run: |
          mkdir -p ~/.ssh
          umask 077
          echo "${{ secrets.PA_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$PA_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to PythonAnywhere
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes "$PA_USERNAME@$PA_HOST" "
            set -e
            cd '$PA_PROJECT_DIR'
            git fetch origin main
            git checkout main
            git pull origin main
            source '$PA_VENV_PATH/bin/activate'
            python -m pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            touch '$PA_WSGI_PATH'
          "