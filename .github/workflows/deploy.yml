name: Django CI/CD Pipeline

on:
  push:
    branches:
      - main  # Triggers the deployment when pushing to main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Automatically load and format the private key securely in memory
    - name: Setup SSH Agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.PA_SSH_KEY }}

    # 2. Register the PythonAnywhere server fingerprint to bypass trust prompts
    - name: Add Host to Known Hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.PA_HOST }} >> ~/.ssh/known_hosts

    # 3. Securely log in and deploy your Django app modifications
    - name: Remote Pull and Web Reload
      run: |
        ssh ${{ secrets.PA_USERNAME }}@${{ secrets.PA_HOST }} << 'EOF'
          cd ~/PrayerGuestsApp
          git pull origin main
          workon myenv
          python manage.py migrate
          python manage.py collectstatic --noinput
          touch /var/www/tardigrade_pythonanywhere_com_wsgi.py
        EOF