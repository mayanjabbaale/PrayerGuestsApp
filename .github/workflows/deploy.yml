name: Deploy to PythonAnywhere

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      PA_HOST: ${{ secrets.PA_HOST }}
      PA_USERNAME: ${{ secrets.PA_USERNAME }}
      PA_SSH_KEY: ${{ secrets.PA_SSH_KEY }}
      PA_PROJECT_DIR: ${{ secrets.PA_PROJECT_DIR || '/home/tardigrade/PrayerGuestsApp' }}
      PA_VENV_PATH: ${{ secrets.PA_VENV_PATH || '/home/tardigrade/.virtualenvs/myenv' }}
      PA_WSGI_PATH: ${{ secrets.PA_WSGI_PATH || '/var/www/tardigrade_pythonanywhere_com_wsgi.py' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PA_SSH_KEY }}

      - name: Verify SSH variables
        env:
          PA_HOST: ${{ secrets.PA_HOST }}
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
        run: |
          if [ -z "${PA_HOST:-}" ] || [ -z "${PA_USERNAME:-}" ]; then
            echo "::error::PA_HOST or PA_USERNAME is not set"
            exit 1
          fi
          echo "PA_HOST and PA_USERNAME are set."

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.PA_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to PythonAnywhere
        shell: bash
        env:
          PA_HOST: ${{ secrets.PA_HOST }}
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_PROJECT_DIR: ${{ secrets.PA_PROJECT_DIR || '/home/tardigrade/PrayerGuestsApp' }}
          PA_VENV_PATH: ${{ secrets.PA_VENV_PATH || '/home/tardigrade/.virtualenvs/myenv' }}
          PA_WSGI_PATH: ${{ secrets.PA_WSGI_PATH || '/var/www/tardigrade_pythonanywhere_com_wsgi.py' }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes "$PA_USERNAME@$PA_HOST" "
            set -e
            cd '$PA_PROJECT_DIR'
            git fetch origin main
            git checkout main
            git pull origin main
            source '$PA_VENV_PATH/bin/activate'
            python -m pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            touch '$PA_WSGI_PATH'
          "
