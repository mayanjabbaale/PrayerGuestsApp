name: Deploy to PythonAnywhere (API-only)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
      PA_API_BASE: ${{ secrets.PA_API_BASE || 'https://www.pythonanywhere.com/api/v0' }}
      PA_USERNAME: ${{ secrets.PA_USERNAME }}
      PA_DOMAIN: ${{ secrets.PA_DOMAIN }}
      PA_PROJECT_DIR: ${{ secrets.PA_PROJECT_DIR || '/home/tardigrade/PrayerGuestsApp' }}
      PA_VENV_PATH: ${{ secrets.PA_VENV_PATH || '/home/tardigrade/.virtualenvs/myenv' }}
      PA_CONSOLE_ID: ${{ secrets.PA_CONSOLE_ID || '' }}
      CONSOLE_READY_TIMEOUT: "180"  # seconds to wait for a cold console to accept input
      DEPLOY_TIMEOUT: "900"         # seconds to wait for deploy commands to finish

    steps:
      - name: Verify required secrets
        run: |
          if [ -z "${PA_API_TOKEN:-}" ] || [ -z "${PA_USERNAME:-}" ] || [ -z "${PA_DOMAIN:-}" ]; then
            echo "::error::PA_API_TOKEN, PA_USERNAME, or PA_DOMAIN is not set"
            exit 1
          fi
          echo "Required secrets are present."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Run deploy commands via PythonAnywhere Console API
        env:
          PA_PROJECT_DIR: ${{ env.PA_PROJECT_DIR }}
          PA_VENV_PATH: ${{ env.PA_VENV_PATH }}
          PA_CONSOLE_ID: ${{ env.PA_CONSOLE_ID }}
          CONSOLE_READY_TIMEOUT: ${{ env.CONSOLE_READY_TIMEOUT }}
          DEPLOY_TIMEOUT: ${{ env.DEPLOY_TIMEOUT }}
        run: |
          python - <<'PYEOF'
          import os
          import sys
          import time
          import uuid
          import requests

          API_BASE = os.environ["PA_API_BASE"]
          TOKEN = os.environ["PA_API_TOKEN"]
          USERNAME = os.environ["PA_USERNAME"]
          PROJECT_DIR = os.environ["PA_PROJECT_DIR"]
          VENV_PATH = os.environ["PA_VENV_PATH"]
          CONSOLE_READY_TIMEOUT = int(os.environ.get("CONSOLE_READY_TIMEOUT", "90"))
          DEPLOY_TIMEOUT = int(os.environ.get("DEPLOY_TIMEOUT", "300"))
          PINNED_CONSOLE_ID = os.environ.get("PA_CONSOLE_ID") or None

          HEADERS = {"Authorization": f"Token {TOKEN}"}
          MARKER = f"__DEPLOY_DONE_{uuid.uuid4().hex}__"

          def api(method, path, expect_ok=True, **kwargs):
              url = f"{API_BASE}/user/{USERNAME}{path}"
              resp = requests.request(method, url, headers=HEADERS, timeout=30, **kwargs)
              if expect_ok and not resp.ok:
                  print(f"::error::{method} {path} failed: {resp.status_code} {resp.text}")
                  sys.exit(1)
              return resp

          def find_existing_console():
              """Look for a live bash console already pointed at PROJECT_DIR."""
              resp = api("GET", "/consoles/", expect_ok=False)
              if resp.status_code != 200:
                  return None
              for c in resp.json():
                  if (
                      c.get("executable") == "bash"
                      and c.get("working_directory") == PROJECT_DIR
                  ):
                      return c["id"]
              return None

          def console_is_responsive(console_id, quick_timeout=10):
              """Probe with a trivial send_input to check if this console is warm."""
              deadline = time.time() + quick_timeout
              while time.time() < deadline:
                  resp = api(
                      "POST",
                      f"/consoles/{console_id}/send_input/",
                      expect_ok=False,
                      json={"input": "\n"},
                  )
                  if resp.status_code == 200:
                      return True
                  if resp.status_code == 412:
                      time.sleep(2)
                      continue
                  return False  # e.g. 404 - console no longer exists
              return False

          def send_input_with_retry(console_id, text, timeout):
              deadline = time.time() + timeout
              attempt = 0
              delay = 3
              while True:
                  attempt += 1
                  resp = api(
                      "POST",
                      f"/consoles/{console_id}/send_input/",
                      expect_ok=False,
                      json={"input": text},
                  )
                  if resp.status_code == 200:
                      return
                  if resp.status_code == 412:
                      if time.time() >= deadline:
                          print(f"::error::Console {console_id} never became ready "
                                f"after {timeout}s")
                          sys.exit(1)
                      print(f"Console not ready yet (attempt {attempt}), "
                            f"retrying in {delay}s...")
                      time.sleep(delay)
                      delay = min(delay * 1.5, 10)
                      continue
                  print(f"::error::send_input failed: {resp.status_code} {resp.text}")
                  sys.exit(1)

          # ---- Console acquisition: pinned -> dynamic lookup -> create new ----
          console_id = None
          created_new = False

          if PINNED_CONSOLE_ID:
              if console_is_responsive(PINNED_CONSOLE_ID):
                  console_id = PINNED_CONSOLE_ID
                  print(f"Reusing pinned console {console_id}")
              else:
                  print(f"Pinned console {PINNED_CONSOLE_ID} not responsive, "
                        f"falling back to lookup/create...")

          if console_id is None:
              existing_id = find_existing_console()
              if existing_id and console_is_responsive(existing_id):
                  console_id = existing_id
                  print(f"Reusing existing console {console_id}")

          if console_id is None:
              console_resp = api(
                  "POST",
                  "/consoles/",
                  json={"executable": "bash", "working_directory": PROJECT_DIR},
              )
              console_id = console_resp.json()["id"]
              created_new = True
              print(f"Created new console {console_id}")
              # Warm-up nudge: gives PA a moment to spin up the backend process
              # before the real deploy command is sent.
              for _ in range(3):
                  api("GET", f"/consoles/{console_id}/get_latest_output/", expect_ok=False)
                  time.sleep(2)

          try:
              cmd = (
                  f"bash -lc \"set -o pipefail; set -x; "
                  f"echo '--- DEPLOY START ---'; "
                  f"cd '{PROJECT_DIR}' || {{ echo 'ERROR: failed to cd {PROJECT_DIR}'; exit 1; }}; "
                  f"echo '=== GIT: fetch/checkout/pull ==='; "
                  f"git fetch origin main || true; git checkout main || true; git pull origin main || true; "
                  f"echo '=== ACTIVATE VENV ==='; source '{VENV_PATH}/bin/activate' || {{ echo 'ERROR: failed to source venv'; exit 1; }}; "
                  f"echo '=== PIP INSTALL ==='; python -m pip install -r requirements.txt -v --no-cache-dir || echo 'pip install failed'; "
                  f"echo '=== MIGRATE ==='; python manage.py migrate --noinput || echo 'migrate failed'; "
                  f"echo '=== COLLECTSTATIC ==='; python manage.py collectstatic --noinput || echo 'collectstatic failed'; "
                  f"rc=$?; echo 'DEPLOY EXIT CODE:' $rc; "
                  f"if [ $rc -ne 0 ]; then echo {MARKER}_FAIL:$rc; else echo {MARKER}_OK; fi\"\n"
              )
              send_input_with_retry(console_id, cmd, CONSOLE_READY_TIMEOUT)
              print("Deploy command accepted, waiting for completion...")

              deadline = time.time() + DEPLOY_TIMEOUT
              output = ""
              while time.time() < deadline:
                  time.sleep(5)
                  out_resp = api("GET", f"/consoles/{console_id}/get_latest_output/")
                  output = out_resp.json().get("output", "")
                  if MARKER in output:
                      break
              else:
                  print("::error::Timed out waiting for deploy command to finish")
                  print(output[-8000:])
                  sys.exit(1)

              print(output[-8000:])  # tail of console output for logs

              if f"{MARKER}_FAIL" in output:
                  print("::error::Deploy command reported failure")
                  sys.exit(1)

              print("Deploy commands completed successfully.")

          finally:
              # Only delete consoles this run created. A pinned or reused
              # console is left running for the next deploy.
              if created_new:
                  try:
                      api("DELETE", f"/consoles/{console_id}/", expect_ok=False)
                      print(f"Deleted console {console_id}")
                  except Exception as e:
                      print(f"Warning: failed to delete console {console_id}: {e}")
          PYEOF

      - name: Reload web app via PythonAnywhere API
        run: |
          status=$(curl -s -o /tmp/reload_response.json -w "%{http_code}" -X POST \
            -H "Authorization: Token ${PA_API_TOKEN}" \
            "${PA_API_BASE}/user/${PA_USERNAME}/webapps/${PA_DOMAIN}/reload/")
          echo "Reload response ($status):"
          cat /tmp/reload_response.json
          if [ "$status" -ne 200 ]; then
            echo "::error::Reload failed with status $status"
            exit 1
          fi
          echo "Web app reloaded successfully."