name: Deploy to PythonAnywhere (API-only)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
      PA_API_BASE: ${{ secrets.PA_API_BASE || 'https://www.pythonanywhere.com/api/v0' }}
      PA_USERNAME: ${{ secrets.PA_USERNAME }}
      PA_DOMAIN: ${{ secrets.PA_DOMAIN }}
      PA_PROJECT_DIR: ${{ secrets.PA_PROJECT_DIR || '/home/tardigrade/PrayerGuestsApp' }}
      PA_VENV_PATH: ${{ secrets.PA_VENV_PATH || '/home/tardigrade/.virtualenvs/myenv' }}
      CONSOLE_READY_TIMEOUT: "90"   # seconds to wait for console to accept input
      DEPLOY_TIMEOUT: "300"         # seconds to wait for deploy commands to finish

    steps:
      - name: Verify required secrets
        run: |
          if [ -z "${PA_API_TOKEN:-}" ] || [ -z "${PA_USERNAME:-}" ] || [ -z "${PA_DOMAIN:-}" ]; then
            echo "::error::PA_API_TOKEN, PA_USERNAME, or PA_DOMAIN is not set"
            exit 1
          fi
          echo "Required secrets are present."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Run deploy commands via PythonAnywhere Console API
        env:
          PA_PROJECT_DIR: ${{ env.PA_PROJECT_DIR }}
          PA_VENV_PATH: ${{ env.PA_VENV_PATH }}
          CONSOLE_READY_TIMEOUT: ${{ env.CONSOLE_READY_TIMEOUT }}
          DEPLOY_TIMEOUT: ${{ env.DEPLOY_TIMEOUT }}
        run: |
          python - <<'PYEOF'
          import os
          import sys
          import time
          import uuid
          import requests

          API_BASE = os.environ["PA_API_BASE"]
          TOKEN = os.environ["PA_API_TOKEN"]
          USERNAME = os.environ["PA_USERNAME"]
          PROJECT_DIR = os.environ["PA_PROJECT_DIR"]
          VENV_PATH = os.environ["PA_VENV_PATH"]
          CONSOLE_READY_TIMEOUT = int(os.environ.get("CONSOLE_READY_TIMEOUT", "90"))
          DEPLOY_TIMEOUT = int(os.environ.get("DEPLOY_TIMEOUT", "300"))

          HEADERS = {"Authorization": f"Token {TOKEN}"}
          MARKER = f"__DEPLOY_DONE_{uuid.uuid4().hex}__"

          def api(method, path, expect_ok=True, **kwargs):
              """Call the PA API. Returns the raw response; caller decides how to
              interpret status codes when expect_ok=False."""
              url = f"{API_BASE}/user/{USERNAME}{path}"
              resp = requests.request(method, url, headers=HEADERS, timeout=30, **kwargs)
              if expect_ok and not resp.ok:
                  print(f"::error::{method} {path} failed: {resp.status_code} {resp.text}")
                  sys.exit(1)
              return resp

          def send_input_with_retry(console_id, text, timeout):
              """POST send_input, retrying on 412 (console backend not started yet)
              with backoff, until it succeeds or timeout elapses."""
              deadline = time.time() + timeout
              attempt = 0
              delay = 3
              while True:
                  attempt += 1
                  resp = api(
                      "POST",
                      f"/consoles/{console_id}/send_input/",
                      expect_ok=False,
                      json={"input": text},
                  )
                  if resp.status_code == 200:
                      return
                  if resp.status_code == 412:
                      if time.time() >= deadline:
                          print(f"::error::Console {console_id} never became ready "
                                f"after {timeout}s (still 412 on attempt {attempt})")
                          sys.exit(1)
                      print(f"Console not ready yet (attempt {attempt}), "
                            f"retrying in {delay}s...")
                      time.sleep(delay)
                      delay = min(delay * 1.5, 10)  # gentle backoff, cap at 10s
                      continue
                  # Any other status is a real failure, not a readiness issue.
                  print(f"::error::send_input failed: {resp.status_code} {resp.text}")
                  sys.exit(1)

          # 1. Create a bash console
          console_resp = api(
              "POST",
              "/consoles/",
              json={"executable": "bash", "working_directory": PROJECT_DIR},
          )
          console = console_resp.json()
          console_id = console["id"]
          print(f"Created console {console_id}")

          try:
              # 2. Nudge the backend awake. Creating the console record doesn't
              # start its process; polling output a couple of times, plus the
              # retry loop in send_input_with_retry, gives PA time to spin it up.
              for _ in range(3):
                  api("GET", f"/consoles/{console_id}/get_latest_output/", expect_ok=False)
                  time.sleep(2)

              # 3. Send the real deploy command, retrying past any 412s.
              cmd = (
                  f"cd '{PROJECT_DIR}' && "
                  f"git fetch origin main && git checkout main && git pull origin main && "
                  f"source '{VENV_PATH}/bin/activate' && "
                  f"python -m pip install -r requirements.txt && "
                  f"python manage.py migrate --noinput && "
                  f"python manage.py collectstatic --noinput && "
                  f"echo {MARKER}_OK || echo {MARKER}_FAIL\n"
              )
              send_input_with_retry(console_id, cmd, CONSOLE_READY_TIMEOUT)
              print("Deploy command accepted, waiting for completion...")

              # 4. Poll for the marker to know when the command finished.
              deadline = time.time() + DEPLOY_TIMEOUT
              output = ""
              while time.time() < deadline:
                  time.sleep(5)
                  out_resp = api("GET", f"/consoles/{console_id}/get_latest_output/")
                  output = out_resp.json().get("output", "")
                  if MARKER in output:
                      break
              else:
                  print("::error::Timed out waiting for deploy command to finish")
                  print(output[-4000:])
                  sys.exit(1)

              print(output[-4000:])  # tail of console output for logs

              if f"{MARKER}_FAIL" in output:
                  print("::error::Deploy command reported failure")
                  sys.exit(1)

              print("Deploy commands completed successfully.")

          finally:
              # 5. Clean up the console regardless of outcome.
              try:
                  api("DELETE", f"/consoles/{console_id}/", expect_ok=False)
                  print(f"Deleted console {console_id}")
              except Exception as e:
                  print(f"Warning: failed to delete console {console_id}: {e}")
          PYEOF

      - name: Reload web app via PythonAnywhere API
        run: |
          status=$(curl -s -o /tmp/reload_response.json -w "%{http_code}" -X POST \
            -H "Authorization: Token ${PA_API_TOKEN}" \
            "${PA_API_BASE}/user/${PA_USERNAME}/webapps/${PA_DOMAIN}/reload/")
          echo "Reload response ($status):"
          cat /tmp/reload_response.json
          if [ "$status" -ne 200 ]; then
            echo "::error::Reload failed with status $status"
            exit 1
          fi
          echo "Web app reloaded successfully."